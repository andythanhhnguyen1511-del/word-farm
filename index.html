<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word Farm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --green:#58cc02; --green-d:#46a302; --blue:#1cb0f6; --blue-d:#1899d6;
  --orange:#ff9600; --orange-d:#e08600; --red:#ff4b4b; --red-d:#ea2b2b;
  --yellow:#ffc800; --purple:#ce82ff; --ink:#3c3c3c; --muted:#777;
  --line:#e5e5e5; --card:#fff;
  --font:'Baloo 2','Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:var(--font);color:var(--ink);font-size:18px;
  background:linear-gradient(#bfe9ff 0,#e3f6ff 40%,#eaf8d8 75%,#cdeca8 100%) fixed;}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
#app{max-width:760px;margin:0 auto;padding:12px 14px 110px;min-height:100vh}
#app.wide{max-width:1400px}
@media (max-width:700px){ .soil{grid-template-columns:repeat(5,minmax(0,1fr))!important} }
#fx{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:60}
h1,h2,h3{margin:.2em 0;line-height:1.15}
h1{font-size:30px;font-weight:800} h2{font-size:24px;font-weight:800} h3{font-size:20px;font-weight:700}
.muted{color:var(--muted)} .small{font-size:15px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.center{justify-content:center}
.spacer{flex:1}

/* nút */
.btn{border:2px solid var(--line);border-bottom-width:5px;background:#fff;border-radius:16px;padding:10px 16px;font-weight:700;cursor:pointer;line-height:1.1;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:active{transform:translateY(3px);border-bottom-width:2px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--green);border-color:var(--green-d);color:#fff}
.btn.blue{background:var(--blue);border-color:var(--blue-d);color:#fff}
.btn.orange{background:var(--orange);border-color:var(--orange-d);color:#fff}
.btn.danger{background:#fff;border-color:#ffc1c1;color:var(--red-d)}
.btn.big{font-size:22px;padding:14px 22px;border-radius:20px;width:100%}
.btn.sm{font-size:15px;padding:6px 10px;border-radius:12px;border-bottom-width:4px}
.icon-btn{border:none;background:none;font-size:26px;cursor:pointer;padding:4px 8px;color:#aaa;font-weight:800}
.spk{border:none;background:#e8f7ff;border-radius:50%;width:46px;height:46px;font-size:24px;cursor:pointer;flex:none;box-shadow:0 3px 0 #c2e8fb}
.spk:active{transform:translateY(2px);box-shadow:none}
.spk.sm{width:34px;height:34px;font-size:17px}
.spk.huge{width:96px;height:96px;font-size:48px;box-shadow:0 6px 0 #b6e2f9}

.card{background:var(--card);border-radius:24px;padding:18px;box-shadow:0 4px 0 rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.06);margin:12px 0}
.pill{background:#fff;border-radius:999px;padding:4px 12px;font-weight:800;box-shadow:0 2px 0 rgba(0,0,0,.08);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}

/* đầu trang + thanh tab */
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.top .title{font-size:24px;font-weight:800;display:flex;align-items:center;gap:6px}
.hud{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.back{border:none;background:#fff;border-radius:14px;padding:6px 12px;font-weight:800;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.1)}
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);box-shadow:0 -4px 18px rgba(0,0,0,.1)}
#tabbar.hide{display:none}
.tb{flex:1;max-width:220px;border:none;background:none;border-radius:16px;padding:6px 4px;font-weight:800;font-size:15px;cursor:pointer;display:flex;flex-direction:column;align-items:center;color:#8a8a8a}
.tb .i{font-size:28px;line-height:1.1}
.tb.on{background:#eaf8d8;color:#3f7d00}
.tb .dot{position:absolute;margin-left:28px;background:var(--red);color:#fff;border-radius:999px;font-size:12px;padding:0 6px}

/* trang học */
.mascot-card{display:flex;gap:12px;align-items:center}
.mascot{font-size:64px;line-height:1;flex:none;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-3deg)}}
.bubble{background:#fff;border-radius:18px;padding:10px 14px;position:relative;font-weight:600;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.bubble:before{content:'';position:absolute;left:-10px;top:50%;margin-top:-8px;border:8px solid transparent;border-right-color:#fff;border-left:0}
.goal-bar{height:22px;background:#e9e9e9;border-radius:999px;overflow:hidden;margin:8px 0}
.goal-bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--yellow),var(--orange));border-radius:999px;transition:width .4s}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:6px 12px;background:#fff;font-weight:800;cursor:pointer}
.chip.on{background:#fff7d6;border-color:var(--yellow);color:#a66b00}
.learn-btn{border:none;width:100%;border-radius:26px;padding:18px;background:var(--green);color:#fff;font-weight:800;font-size:28px;cursor:pointer;box-shadow:0 7px 0 var(--green-d);display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0 14px}
.learn-btn:active{transform:translateY(5px);box-shadow:0 2px 0 var(--green-d)}
.learn-btn .sub{display:block;font-size:15px;font-weight:600}
.list-card{cursor:pointer}
.wchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.wchip{font-size:14px;font-weight:700;border-radius:10px;padding:1px 8px;background:#f1f1f1;color:#666}
.wchip.done{background:#eaffd6;color:#3f7d00}
.wchip.due{background:#fff2d6;color:#a66b00}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.wcell{border:none;background:#fff;border-radius:18px;padding:10px 8px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.08);display:flex;flex-direction:column;align-items:center;gap:2px}
.wcell .ic{font-size:28px;line-height:1.1}
.wcell .wd{font-weight:800;font-size:17px;word-break:break-word;text-align:center}
.wcell .st{font-size:13px;color:var(--muted)}
.mini{width:80%;height:7px;background:#eee;border-radius:9px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--green)}
.note{font-size:15px;color:var(--muted);text-align:center;margin-top:8px}

/* hình của từ */
.pic{display:flex;justify-content:center;align-items:center;margin:6px auto}
.wimg{width:200px;height:200px;object-fit:cover;border-radius:20px;background:#f3f3f3;box-shadow:0 4px 0 rgba(0,0,0,.08)}
.wimg.big{width:min(260px,66vw);height:min(260px,66vw)}
.wimg.sm{width:130px;height:130px}
.wemoji{font-size:120px;line-height:1.1;width:200px;height:200px;display:flex;align-items:center;justify-content:center;background:#fff8e6;border-radius:20px}
.wemoji.big{width:min(260px,66vw);height:min(260px,66vw);font-size:140px}
.wemoji.sm{width:130px;height:130px;font-size:80px}
.wletter{font-size:110px;font-weight:800;color:#fff;width:200px;height:200px;display:flex;align-items:center;justify-content:center;border-radius:20px;background:linear-gradient(135deg,var(--blue),var(--purple))}
.wletter.big{width:min(260px,66vw);height:min(260px,66vw)}
.wletter.sm{width:130px;height:130px;font-size:70px}

/* trò chơi */
.gbar{display:flex;align-items:center;gap:8px}
.wcount{font-weight:800;color:#5a8f00;white-space:nowrap}
.rdots{flex:1;display:flex;gap:6px;align-items:center}
.rdots i{flex:1;height:14px;border-radius:999px;background:#e5e5e5}
.rdots i.ok{background:var(--green)}
.rdots i.now{background:var(--yellow);box-shadow:0 0 0 3px rgba(255,200,0,.3)}
.combo{font-weight:800;color:var(--orange);min-width:36px;text-align:center}
.combo.hot{animation:pulse .8s infinite}
@keyframes pulse{50%{transform:scale(1.2)}}
.glabel{text-align:center;font-weight:800;color:#5a8f00;margin-top:8px;font-size:17px}
.gbody{text-align:center}
.w-big{font-size:44px;font-weight:800;display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}
.w-big.ok{color:var(--green-d)}
.phon{color:var(--muted);font-size:18px}
.vi{font-size:24px;font-weight:700;color:#d35400}
.examples{text-align:left;margin:10px 0}
.ex{display:flex;gap:10px;align-items:center;background:#f7fbff;border-radius:14px;padding:8px 10px;margin:6px 0;font-size:19px}
.ex b{color:var(--blue-d)}
.word-slots{display:flex;justify-content:center;gap:5px;margin:18px 0;flex-wrap:nowrap}
.slot{width:clamp(26px,calc((100vw - 70px)/var(--n)),56px);height:clamp(40px,calc((100vw - 70px)/var(--n)*1.25),66px);max-width:56px;
  border-radius:12px;border:3px solid #ddd;background:#fff;font-size:clamp(20px,calc((100vw - 70px)/var(--n)*.7),36px);font-weight:800;display:flex;align-items:center;justify-content:center;padding:0;text-transform:lowercase}
.slot.given{border-color:transparent;background:#eef7e6;color:#4a7d00}
.slot.blank{border-style:dashed;border-color:#b9b9b9;cursor:pointer;background:#fffdf3}
.slot.filled{border-style:solid;border-color:var(--blue);color:var(--blue-d);background:#eef9ff}
.slot.active{border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,150,0,.25)}
.slot.locked{border-style:solid;border-color:var(--green);background:#eaffd6;color:var(--green-d)}
.slot.bad{border-color:var(--red);background:#ffecec;color:var(--red-d)}
.gap{width:14px}
.tray{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:10px 0 6px}
.ltile{width:60px;height:64px;border-radius:16px;border:2px solid #d6d6d6;border-bottom-width:6px;background:#fff;font-size:32px;font-weight:800;cursor:pointer}
.ltile:active{transform:translateY(3px);border-bottom-width:3px}
.ltile.used{visibility:hidden}
.ltile.bad{opacity:.25;text-decoration:line-through;cursor:not-allowed}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.kb{display:flex;flex-direction:column;gap:6px;align-items:center;margin-top:8px;user-select:none}
.kb .kr{display:flex;gap:5px;justify-content:center;width:100%}
.key{flex:1;max-width:52px;height:52px;border-radius:12px;border:2px solid #d6d6d6;border-bottom-width:5px;background:#fff;font-size:22px;font-weight:800;cursor:pointer;padding:0}
.key:active{transform:translateY(2px);border-bottom-width:3px}
.key.wide{max-width:90px;flex:1.6;background:#fff3e0}
.result .reward{font-size:24px;font-weight:800;color:#b37400;margin:6px 0}
.result .note2{font-size:18px;font-weight:700;margin:4px 0}
.mascot-row{display:flex;gap:10px;align-items:center;margin-top:14px}
.mascot-row .mascot{font-size:52px}
.clue-vi{font-size:30px;font-weight:800;color:#d35400;background:#fff5e8;border-radius:20px;padding:30px 16px}
.done-card .big-ic{font-size:80px;line-height:1}
.def{font-size:19px;line-height:1.35;color:#4a4a4a;background:#fff8ea;border-radius:14px;padding:8px 12px;margin:8px auto;max-width:560px;text-align:left}
.def b{color:#d35400}
.def.sm{font-size:17px}

/* background word preparation */
#prep{position:fixed;left:50%;transform:translateX(-50%);top:8px;z-index:45;display:none;background:#fff;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.15);padding:6px 16px 9px;font-size:14px;font-weight:700;overflow:hidden;min-width:220px;text-align:center}
#prep.on{display:block}
#prep.ok{background:#eaffd6}
#prep i{position:absolute;left:0;bottom:0;height:4px;background:var(--green);transition:width .3s}

/* seed shop: all groups on one page, chips stay on top as quick links */
.chips.jump{position:sticky;top:0;z-index:5;background:#fff;padding:8px 0;margin:-4px 0 0;box-shadow:0 6px 8px -8px rgba(0,0,0,.25)}
.seed-cat{scroll-margin-top:64px;margin-top:18px;padding-top:12px;border-top:2px dashed var(--line)}
.seed-cat:first-of-type{border-top:none;margin-top:6px}
.shop-grid.compact{grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.shop-grid.compact .item{padding:5px 6px 7px;gap:2px;border-radius:14px}
.shop-grid.compact .item .th{height:64px;border-radius:10px}
.shop-grid.compact .item b{font-size:14px;line-height:1.2}
.shop-grid.compact .meta{font-size:12px;line-height:1.3;color:var(--muted)}
.shop-grid.compact .meta b{font-size:12px;color:#3f7d00}
.shop-grid.compact .btn.sm{padding:4px 8px;font-size:14px}
.seed-cat h3{font-size:18px}
/* pen pictures in the shop */
.pen-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.pen-card{border:2px solid var(--line);border-radius:16px;background:#fff;padding:8px;display:flex;flex-direction:column;gap:4px;text-align:center}
.pen-card .pic2{border-radius:12px;overflow:hidden;background:linear-gradient(#e3f4ff,#e3f4ff 45%,#b5dc7b 45%)}
.pen-card svg{display:block;width:100%;height:auto}
.pen-card .meta{font-size:13px;color:var(--muted);line-height:1.35}
button.pen-card{cursor:pointer;font:inherit;color:inherit}
button.pen-card:hover{border-color:var(--orange)}
button.pen-card:disabled{opacity:.5;cursor:not-allowed}

/* file import preview */
.draft.wide .drow{grid-template-columns:28px minmax(80px,1fr) minmax(80px,1fr) minmax(110px,1.6fr) minmax(110px,1.6fr) 40px}
pre.fmt{background:#f7f9fc;border-radius:12px;padding:8px 10px;white-space:pre-wrap;margin:6px 0}
@media (max-width:640px){ .draft.wide .drow{grid-template-columns:24px 1fr 1fr 36px} .draft.wide .drow input[data-field=draft-def], .draft.wide .drow input[data-field=draft-ex]{grid-column:2 / 4} }

/* review rules */
.rules{display:flex;flex-direction:column;gap:8px}
.rule{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#f7f9fc;border-radius:14px;padding:8px 10px}
.rule select,.rule input{width:auto;padding:6px 10px;border-radius:10px}
.rule .lbl{font-weight:700;min-width:120px}
.rres{display:flex;flex-direction:column;gap:4px;max-height:60vh;overflow:auto}
.rrow{display:grid;grid-template-columns:28px minmax(90px,1.2fr) minmax(80px,1fr) 70px 90px 70px;gap:8px;align-items:center;padding:6px 8px;border-radius:10px;background:#fff;border:2px solid var(--line);cursor:pointer;font-size:15px}
.rrow.on{border-color:var(--green);background:#f3ffe9}
.rrow input{width:20px;height:20px}
.rrow.head{background:none;border:none;cursor:default;font-size:13px;color:var(--muted);font-weight:700}
.fbar{display:inline-block;height:8px;border-radius:9px;background:#eee;width:50px;vertical-align:middle;overflow:hidden}
.fbar i{display:block;height:100%;background:linear-gradient(90deg,#ffc800,#ff4b4b)}
@media (max-width:640px){ .rrow{grid-template-columns:28px 1fr 1fr 60px} .rrow .hide-sm{display:none} }

/* animal pens */
.field.ranch{background:repeating-linear-gradient(115deg,#8bc34a 0 22px,#83bb43 22px 44px)}
.pen{position:relative;border-radius:20px;padding:10px;display:grid;grid-template-columns:repeat(5,minmax(0,160px));justify-content:space-evenly;gap:8px;background:var(--floor);
  border:7px solid #b07a45;box-shadow:0 6px 0 #6b4220,inset 0 0 0 3px #e0a868;background-image:radial-gradient(rgba(255,255,255,.18) 1.5px,transparent 2px);background-size:14px 14px}
.pen .pond{position:absolute;right:12px;bottom:10px;width:30%;height:42%;border-radius:50%;background:radial-gradient(#9fdcff,#4fb3e8);opacity:.85;pointer-events:none}
.aslot{position:relative;border:none;background:rgba(255,255,255,.22);border-radius:16px;cursor:pointer;aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:4px 2px 6px;z-index:1}
.aslot:hover{background:rgba(255,255,255,.4)}
.aslot small{font-size:12px;font-weight:800;color:#4e342e;background:rgba(255,255,255,.75);border-radius:8px;padding:0 6px;white-space:nowrap}
.aslot.empty{border:3px dashed rgba(255,255,255,.75);justify-content:center;gap:2px}
.aslot .plus{font-size:28px;color:#fff;font-weight:800;line-height:1}
.asvg{width:100%;height:auto;max-height:110px;overflow:visible}
/* strolling: walk right, turn round, walk back (the whole animal flips); legs step while walking */
.asvg .walker{transform-box:fill-box;transform-origin:50% 100%;animation:wander var(--wd,10s) ease-in-out var(--d,0s) infinite}
@keyframes wander{0%,5%{transform:translateX(-10px) scaleX(1)}44%{transform:translateX(10px) scaleX(1)}48%,55%{transform:translateX(10px) scaleX(-1)}94%{transform:translateX(-10px) scaleX(-1)}98%,100%{transform:translateX(-10px) scaleX(1)}}
.asvg .a-leg{transform-box:fill-box;transform-origin:50% 0;animation:step .42s ease-in-out infinite alternate}
.asvg .a-leg.b{animation-direction:alternate-reverse}
@keyframes step{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
.asvg .hop{transform-box:fill-box;transform-origin:50% 100%;animation:bounce .84s ease-in-out infinite}
@keyframes bounce{50%{transform:translateY(-1.6px)}}
.asvg .a-eye{transform-box:fill-box;transform-origin:center;animation:blink 4.2s var(--d,0s) infinite}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
.asvg .a-tail{transform-box:fill-box;transform-origin:100% 50%;animation:wag .6s ease-in-out infinite alternate}
@keyframes wag{from{transform:rotate(-14deg)}to{transform:rotate(16deg)}}
.asvg .a-wing{transform-box:fill-box;transform-origin:75% 25%;animation:flap 2.8s var(--d,0s) ease-in-out infinite}
@keyframes flap{0%,78%,100%{transform:rotate(0)}83%,93%{transform:rotate(-26deg)}88%{transform:rotate(4deg)}}
.asvg .a-head{transform-box:fill-box;transform-origin:25% 85%;animation:look 5.5s var(--d,0s) ease-in-out infinite}
@keyframes look{0%,35%,100%{transform:rotate(0)}45%,55%{transform:rotate(-9deg)}65%,75%{transform:rotate(7deg)}}
/* eating: stand still, head goes down to the food again and again */
.asvg.busy .walker{animation:none;transform:translateX(-6px)}
.asvg.busy .a-leg,.asvg.ready .a-leg,.asvg.busy .hop{animation:none}
.asvg.busy .a-head{animation:peck .9s ease-in-out infinite}
@keyframes peck{0%,100%{transform:rotate(0)}45%,60%{transform:rotate(24deg) translateY(5px)}}
/* product ready: jump for joy, with sparkles */
.asvg.ready .walker{animation:none}
.asvg.ready .hop{animation:joy .8s ease-in-out infinite}
@keyframes joy{0%,100%{transform:translateY(0) scaleY(1)}35%{transform:translateY(-10px) scaleY(1.04)}55%{transform:translateY(0) scaleY(.92)}70%{transform:translateY(0) scaleY(1.02)}}
.asvg .a-spark path{transform-box:fill-box;transform-origin:center;animation:twinkle 1.2s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(.3);opacity:.2}50%{transform:scale(1.15);opacity:1}}
/* hungry: a little impatient hop now and then */
.asvg.hungry .hop{animation:hungry 3s var(--d,0s) ease-in-out infinite}
@keyframes hungry{0%,80%,100%{transform:translateY(0)}86%{transform:translateY(-6px)}92%{transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){.asvg *{animation:none!important}}
.item .th.animal{background:linear-gradient(#e8f7ff,#e8f7ff 62%,#b5dc7b 62%);display:flex;align-items:flex-end;justify-content:center}
.item .th.animal .asvg{max-height:100px;width:auto;height:100%}
.sp .th .asvg{height:90px;width:auto}
.sp.locked{opacity:.5}
@media (max-width:700px){ .pen{grid-template-columns:repeat(3,minmax(0,1fr))} }

/* thumbnails, picture picker, list editor */
.thumb{width:64px;height:64px;border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#fff8e6;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb.sm{width:44px;height:44px}
.tl{font-size:34px;font-weight:800;color:#5a6;line-height:1}
.thumb.sm .tl{font-size:24px}
.tl.big{font-size:44px}
.pk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;max-height:60vh;overflow:auto;margin-top:8px}

.sign:after{content:'';position:absolute;left:50%;bottom:-17px;width:8px;height:14px;margin-left:-4px;background:#8d5a2b;border-radius:0 0 3px 3px;z-index:-1}

.sign-t{font-size:16px}
.land:active .sign{transform:translateY(3px);box-shadow:0 2px 0 #6b4220}

@keyframes floatup{to{transform:translate(-50%,-90px);opacity:0}}

function normalize(raw) {
  const d = defaultState();
  if (!raw) return d;
  const T = Object.assign(d, raw);
  for (const k of ['daily', 'streak', 'settings', 'stats', 'flags']) T[k] = Object.assign(defaultState()[k], raw[k] || {});
  if (!raw.v || raw.v < 2) {
    // v1: words had level 0..7 and the garden had fertilizer. Keep coins, turn fertilizer into water, start a fresh garden.
    const f = raw.farm || {};
    T.farm = Object.assign(defaultState().farm, {coins:f.coins || 10, water:(f.water || 0) + (f.fert || 0) * 2 + 6});
    for (const w of Object.values(T.words)) { w.mastered = (w.level || 0) >= 7; w.step = w.mastered ? roundsFor(w).length : 0; delete w.level; }
  }
  T.farm = Object.assign(defaultState().farm, T.farm);
  if (T.farm.beds.some(b => b.plots.length !== PLOTS_PER_BED)) {
    // older beds had 4 spots: keep the beds bought (max 8), each now has 10 spots, keep every plant
    const plants = T.farm.beds.flatMap(b => b.plots).filter(Boolean);
    const n = Math.min(MAX_BEDS, Math.max(T.farm.beds.length, Math.ceil(plants.length / PLOTS_PER_BED), 1));
    T.farm.beds = Array.from({length:n}, newBed);
    plants.slice(0, n * PLOTS_PER_BED).forEach((p, i) => { T.farm.beds[Math.floor(i / PLOTS_PER_BED)].plots[i % PLOTS_PER_BED] = p; });
  }
  for (const w of Object.values(T.words)) {
    if (w.step == null) w.step = 0;
    if (w.mastered == null) w.mastered = false;
    if (w.mastered && !w.masteredAt) w.masteredAt = w.last || null;
    if (w.enrichV !== 2) {
      // older words: Vietnamese meaning and an automatic picture -> English definition and a picture chosen with care
      w.def = w.def || ''; w.defUser = !!w.def; w.exUser = false; w.examples = [];
      w.pics = []; w.pic = ''; w.picDone = false; w.enriched = false;
      delete w.vi; delete w.imgs; delete w.imgIdx; delete w.defs;
      w.enrichV = 1;
    }
  }
  T.stickers = (T.stickers || []).filter(id => BADGES.some(b => b.id === id));
  // older saves never got the free coop. Check the saved flags, not the merged ones (those already carry the default).
  // 'coopGift' replaces an earlier 'demoPen' flag that an older build wrote into saves without adding the coop.
  if (!(raw.flags && raw.flags.coopGift)) { if (!(T.farm.pens || []).length) T.farm.pens = [demoPen()]; T.flags.coopGift = true; }
  if (!Array.isArray(T.reviewPlans)) T.reviewPlans = [];
  // every pen now holds 5 animals: give older, smaller pens the extra places
  for (const pen of T.farm.pens || []) { const cap = (ANIMALS[pen.t] || {}).cap || 5; while (pen.animals.length < cap) pen.animals.push(null); }
  T.v = 3;
  return T;
}

// mark = false: housekeeping only (e.g. a new day started); it must not count as a newer copy for cloud sync,

function normWord(s) {
  let w = String(s || '').toLowerCase().replace(/[’`´]/g, "'").replace(/\s+/g, ' ').trim();
  w = w.replace(/^[^a-z]+|[^a-z]+$/g, '');
  if (!w || /[^a-z' -]/.test(w)) return '';

}
const blankWord = (id, listId, word, def) => ({id, listId, word, def:(def || '').trim(), defUser:!!(def || '').trim(), phonetic:'', pos:'', examples:[], exUser:false, pics:[], pic:'', picDone:false, img:'',
  emoji:EMOJI[word] || '', audio:'', step:0, mastered:false, masteredAt:null, box:0, due:0, wrong:0, right:0, last:0, enriched:false, added:Date.now()});
// pairs: [word, definition, example sentences (optional array)]
function addWords(listId, pairs) {
  const existing = new Set(Object.values(S.words).filter(w => w.listId === listId).map(w => w.word));
  const added = [];
  for (const [word, def, examples] of pairs) {
    const w = normWord(word);
    if (!w || existing.has(w)) continue;
    existing.add(w);
    const id = uid();
    S.words[id] = blankWord(id, listId, w, def);
    S.words[id].added += added.length;
    const ex = (examples || []).map(s => String(s).trim()).filter(Boolean);
    if (ex.length) { S.words[id].examples = ex; S.words[id].exUser = true; }
    added.push(id);
  }
  save();
  return added;
}
const listWords = (listId, T = S) => Object.values(T.words).filter(w => w.listId === listId).sort((a, b) => a.added - b.added);
const mastered = (T = S) => Object.values(T.words).filter(w => w.mastered).length;

/* Rounds for one word: meet the word → 1 blank → 2 blanks (letters to pick) → 3 → 4 blanks (type them) → type the whole word.
   There are always fewer blanks than letters, so short words have fewer rounds. */
function roundsFor(w) {
  const n = letterIdx(w).length, r = [{k:'card'}];
  for (const b of [1, 2, 3, 4]) if (b < n) r.push({k:'blank', b, choices:b <= 2});
  r.push({k:'type'});
  return r;
}

  if (w.mastered) return w.due <= Date.now() ? {cls:'due', ic:'🔁', txt:'Review'} : {cls:'done', ic:'⭐', txt:'Learned'};
  const n = roundsFor(w).length;
  return w.step ? {cls:'', ic:'📝', txt:`Learning ${w.step}/${n}`} : {cls:'', ic:'🆕', txt:'New word'};
}

// ---------- IndexedDB for your own photos ----------
const IMG = {};
const IDB = {
  db:null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      const r = indexedDB.open('nttv', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('imgs');
      r.onsuccess = () => { this.db = r.result; res(this.db); };
      r.onerror = () => rej(r.error);
    });
  },
  async put(k, v) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('imgs', 'readwrite'); t.objectStore('imgs').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); },
  async del(k) { const db = await this.open(); return new Promise(res => { const t = db.transaction('imgs', 'readwrite'); t.objectStore('imgs').delete(k); t.oncomplete = res; t.onerror = res; }); },
  async all() {
    const db = await this.open();
    return new Promise(res => {
      const out = {}; const req = db.transaction('imgs').objectStore('imgs').openCursor();
      req.onsuccess = () => { const c = req.result; if (c) { out[c.key] = c.value; c.continue(); } else res(out); };
      req.onerror = () => res(out);
    });
  }
};
function dropImage(id) { if (IMG[id]) { delete IMG[id]; IDB.del(id).catch(() => {}); if (typeof Cloud !== 'undefined') Cloud.photoRemoved([id]); } }
function resizeImage(file, max = 360) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const im = new Image();
    im.onload = () => {
      const sc = Math.min(1, max / Math.max(im.width, im.height));
      const cv = document.createElement('canvas'); cv.width = Math.round(im.width * sc); cv.height = Math.round(im.height * sc);
      cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url);
      res(cv.toDataURL('image/jpeg', 0.82));
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
    im.src = url;
  });
}

/* =========================================================
   CLOUD SYNC (Supabase)
   This device stays the main copy: everything works offline. When a parent is signed in,
   changed children are uploaded a few seconds after each change, and newer copies from
   other devices are downloaded when the app opens or comes back to the front.
   If two devices change the same child, the most recent change wins.
   ========================================================= */
const loadScript = src => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('load')); document.head.appendChild(s); });
const dataUrlToBlob = u => fetch(u).then(r => r.blob());
const blobToDataUrl = b => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(b); });
const Cloud = {
  sb:null, user:null, status:'off', err:'', lastSync:0, lastPull:0, busy:false, again:false, pushT:0, sentTo:'', needPhotoScan:false,
  enabled() { return !!(SUPABASE_URL && SUPABASE_ANON_KEY) || !!this.sb; },
  // --- the few calls to Supabase, kept together ---
  api:{
    list:() => Cloud.sb.from('children').select('id,updated_at,deleted'),
    get:ids => Cloud.sb.from('children').select('id,name,avatar,state,updated_at,created_at').in('id', ids),
    stamps:ids => Cloud.sb.from('children').select('id,updated_at').in('id', ids),
    upsert:rows => Cloud.sb.from('children').upsert(rows, {onConflict:'owner,id'}),
    photoPath:id => `${Cloud.user.id}/${id}.jpg`,
    photoUp:(id, blob) => Cloud.sb.storage.from('photos').upload(Cloud.api.photoPath(id), blob, {upsert:true, contentType:'image/jpeg'}),
    photoDown:id => Cloud.sb.storage.from('photos').download(Cloud.api.photoPath(id)),
    photoDel:ids => Cloud.sb.storage.from('photos').remove(ids.map(Cloud.api.photoPath))
  },
  async init() {
    if (!this.enabled()) return;
    try { await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js'); }
    catch (e) { return this.setStatus('error', 'Could not load the cloud library. Check your internet connection.'); }
    // opened from a "reset password" email: ask for the new password once signed in

const Speech = {

    };

  c() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); if (this.ctx.state === 'suspended') this.ctx.resume(); return this.ctx; },

const FX = {
  cv:null, ctx:null, p:[], raf:0,
  init() {
    this.cv = $('#fx'); this.ctx = this.cv.getContext('2d');
    const rs = () => { this.cv.width = innerWidth * devicePixelRatio; this.cv.height = innerHeight * devicePixelRatio; };
    rs(); addEventListener('resize', rs);
  },
  burst(n = 80, emojis = null, x = innerWidth / 2, y = innerHeight / 3, spread = 8) {
    const cols = ['#58cc02', '#ffc800', '#ff4b4b', '#1cb0f6', '#ce82ff', '#ff9600'];
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, sp = 2 + Math.random() * spread;
      this.p.push({born:performance.now(), x, y, vx:Math.cos(a) * sp, vy:Math.sin(a) * sp - 5, life:80 + Math.random() * 40, c:pick(cols), e:emojis ? pick(emojis) : null,
        s:emojis ? 22 + Math.random() * 12 : 6 + Math.random() * 6, rot:Math.random() * 6});
    }
    if (!this.raf) this.loop();
  },
  loop() {
    const c = this.ctx, d = devicePixelRatio, now = performance.now();
    c.clearRect(0, 0, this.cv.width, this.cv.height);
    this.p = this.p.filter(p => p.life-- > 0 && now - p.born < 3500);
    for (const p of this.p) {
      p.vy += .25; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.rot += .1;
      c.save(); c.globalAlpha = Math.min(1, p.life / 30); c.translate(p.x * d, p.y * d); c.rotate(p.e ? p.rot * .2 : p.rot);
      if (p.e) { c.font = `${p.s * d}px serif`; c.textAlign = 'center'; c.fillText(p.e, 0, 0); }
      else { c.fillStyle = p.c; c.fillRect(-p.s * d / 2, -p.s * d / 4, p.s * d, p.s * d / 2); }
      c.restore();
    }
    this.raf = this.p.length ? requestAnimationFrame(() => this.loop()) : 0;
    if (!this.raf) c.clearRect(0, 0, this.cv.width, this.cv.height);
  }
};

let draft = [];
let addState = {tab:'text', list:'', newName:'', ocr:null};
const STOP = new Set('the a an and or of to in on at is are am was were be it this that these those i you he she we they my your his her our their me him us them for with as by from not no yes do does did can will has have had so but if then there here what which who how why when where'.split(' '));
const VI_RE = /[àáạảãâầấậẩẫăằắặẳẵèéẹẻẽêềếệểễìíịỉĩòóọỏõôồốộổỗơờớợởỡùúụủũưừứựửữỳýỵỷỹđ]/i;
const VI_COMMON = new Set('con cai cay qua la cua va cho ban anh em chi me bo ong ba co chu toi nha xe hoa mau so ngay thang nam mot hai bon sau bay tam chin muoi'.split(' '));
function parseVocab(text, fromOCR = false) {
  const out = [], seen = new Set(draft.map(d => normWord(d.word)));
  const push = (w, def = '') => {
    w = normWord(String(w));
    if (!w || (w.length < 2 && w !== 'a' && w !== 'i')) return;
    if (w.split(' ').length > 3 || seen.has(w)) return;
    def = String(def).trim().replace(/^[-–—:=\s]+/, '');
    seen.add(w); out.push({word:w, def:VI_RE.test(def) ? '' : def}); // Vietnamese meanings are left out: definitions are in English now
  };
  for (let line of String(text).split(/\r?\n/)) {
    line = line.replace(/^\s*(\d+|[a-zA-Z])[.)]\s+/, '').replace(/^\s*[-•*·●▪►✓]\s*/, '').trim();
    // part of speech (n), (v)… and phonetics /…/ between the word and its meaning act as a separator
    line = line.replace(/\s*(\((n|v|adj|adv|prep|pron|conj|int|det)\.?\)|\/[^/]+\/|\[[^\]]+\])\s*/gi, '\t').replace(/\t+/g, '\t').replace(/\t$/, '').trim();
    if (!line) continue;
    if (VI_RE.test(line) && !/\t|\s[-–—]\s|[:=]/.test(line)) {
      const [first, ...rest] = line.split(/\s+/);
      if (!VI_RE.test(first) && !VI_COMMON.has(first.toLowerCase())) push(first, rest.join(' '));
      continue;
    }
    const m = line.match(/^(.+?)\s*(?:\t+|\s+[-–—]\s+|\s*[:=]\s*)(.+)$/);
    if (m) {
      let [, a, b] = m;
      if (VI_RE.test(a) && !/[^\x00-\x7f]/.test(b)) [a, b] = [b, a];
      if (/\d/.test(a)) continue; // headings like "Unit 5: At the zoo"
      push(a, b); continue;
    }
    if (/[,;]/.test(line)) { line.split(/[,;]/).forEach(x => push(x)); continue; }
    const toks = line.split(/\s+/);
    if (toks.length <= 2 && (!fromOCR || toks.every(t => /^[a-zA-Z'-]+$/.test(t)))) { push(line); continue; }
    toks.forEach(t => { if (/[^\x00-\x7f]/.test(t)) return; const n = normWord(t); if (n && n.length >= 2 && !STOP.has(n)) push(n); });
  }
  return out;
}

// CSV / TSV without any library: quoted cells, doubled quotes, commas and line breaks inside quotes
function parseDelimited(text, sep) {
  text = String(text).replace(/^﻿/, '');
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; continue; }
    if (ch === '"') q = true;
    else if (ch === sep) { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

function parseNotes(text) {

    const h = line.match(/^(?:#{1,6}\s*|(?:list|unit|lesson|topic)\s*:\s*)(.+)$/i);
    if (h) { list = h[1].replace(/[#*_`]/g, '').trim(); continue; }
    line = line.replace(/^\s*(\d+|[a-zA-Z])[.)]\s+/, '').replace(/^\s*[-•*·●▪►✓]\s+/, '');
    let word, def = '', ex = [];
    if (line.includes('\t')) { const c = line.split('\t'); word = c[0]; def = c[1] || ''; ex = c.slice(2); }

  const left = S.daily.goal - S.daily.words.length;

  const learn = pool.filter(w => !w.mastered).sort((a, b) => ((b.step > 0) - (a.step > 0)) || (a.added - b.added)).slice(0, n);
  let items = [...reviews.map(w => ({id:w.id, review:true})), ...learn.map(w => ({id:w.id}))];

function kidSummary(T) {
  const ws = Object.values(T.words), days = T.stats.days || {};

  const week = [...Array(7)].map((_, i) => dstr(new Date(Date.now() - i * DAY)));
  return {
    total:ws.length, mastered:ws.filter(w => w.mastered).length, learning:ws.filter(w => !w.mastered && w.step > 0).length,
    due:ws.filter(w => w.mastered && w.due <= Date.now()).length,
    weekLearned:ws.filter(w => w.mastered && w.masteredAt && week.includes(dstr(new Date(w.masteredAt)))).length,
    weekSecs:week.reduce((a, d) => a + ((days[d] && days[d].s) || 0), 0),
    todaySecs:(days[today()] || {}).s || 0, todayWords:T.daily.date === today() ? T.daily.words.length : 0, goal:T.daily.goal,
    accuracy:T.stats.correct ? Math.round(T.stats.correct / (T.stats.correct + T.stats.wrong) * 100) : 0,

      ${learned.map(w => `<tr><td><b>${esc(w.word)}</b></td><td class="small">${esc(clip(w.def))}</td><td class="small">${esc(listName(w.listId))}</td><td>${fmtDate(w.masteredAt)}</td>

const clip = (s, n = 70) => { s = String(s || ''); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
function reportCSV(id) {
  const T = stateOf(id), p = profile(id);
  const listName = l => (T.lists.find(x => x.id === l) || {}).name || '';
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const rows = [['word', 'definition', 'list', 'status', 'learned_on', 'review_level', 'next_review', 'correct', 'wrong']];
  for (const w of Object.values(T.words).sort((a, b) => a.added - b.added))
    rows.push([w.word, w.def || '', listName(w.listId), wordStatus(w).txt, w.masteredAt ? dstr(new Date(w.masteredAt)) : '', w.mastered ? w.box : '', w.mastered ? dstr(new Date(w.due)) : '', w.right, w.wrong]);
  const blob = new Blob(['﻿' + rows.map(r => r.map(q).join(',')).join('\r\n')], {type:'text/csv'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `word-farm-${p.name.replace(/\s+/g, '-')}-${today()}.csv`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

  'draft-save': () => {
    // rows naming a list go into that list (created if needed); the others into the list chosen above
    const byList = new Map();
    let defaultId = null;
    const chosen = () => {
      if (defaultId) return defaultId;
      defaultId = addState.list;
      if (defaultId === 'new') { defaultId = addList(addState.newName.trim() || ('List ' + new Date().toLocaleDateString('en-US'))); addState.list = defaultId; addState.newName = ''; }
      return defaultId;
    };
    for (const d of draft) {
      const name = (d.list || '').trim();
      let id = name ? (S.lists.find(l => l.name.trim().toLowerCase() === name.toLowerCase()) || {}).id : chosen();
      if (!id) id = addList(name);
      if (!byList.has(id)) byList.set(id, []);
      byList.get(id).push([d.word, d.def, String(d.ex || '').split('|')]);
    }
    const ids = [];
    for (const [id, pairs] of byList) ids.push(...addWords(id, pairs));
    const skipped = draft.length - ids.length;
    draft = []; addState.ocr = null; addState.fileMsg = '';
    toast(`💾 Added ${plural(ids.length, 'new word')}${byList.size > 1 ? ` to ${byList.size} lists` : ''}!${skipped ? ` (skipped ${skipped} duplicate or invalid)` : ''}`, 3200);
    Sfx.win(); FX.burst(50);
    queueEnrich(ids);
    const first = [...byList.keys()][0];
    if (byList.size === 1 && first) go('list', {id:first}); else go('learn');
  },
  'tpl-sheet': () => downloadText('word-farm-template.csv', '﻿' + [
    'list,word,definition,example,example 2',
    'Unit 1: Animals,cat,A cat is a small furry pet.,The cat is sleeping.,My cat likes milk.',
    'Unit 1: Animals,dog,A dog is an animal that barks.,My dog likes to run.,',
    'Unit 2: Food,apple,"An apple is a sweet, round fruit.",I eat an apple every day.,',
    'Unit 2: Food,bread,,,'
  ].join('\r\n'), 'text/csv'),
  'tpl-note': () => downloadText('word-farm-template.txt', [
    '# Unit 1: Animals', 'cat - A cat is a small furry pet. | The cat is sleeping.', 'dog - A dog is an animal that barks. | My dog likes to run.',
    '', '# Unit 2: Food', 'apple - An apple is a sweet, round fruit. | I eat an apple every day.', 'bread'
  ].join('\r\n'), 'text/plain'),
  // game
  'quit': async () => {
    if (!await askModal('Stop learning? The word you\'re on is saved, so you can continue next time.', 'Stop')) return;
    G = null; go('learn');
  },
  'say-word': () => Speech.say(G.cur.w.word, G.cur.w),
  'say-slow': () => Speech.say(G.cur.w.word, G.cur.w, .55),
  'say-ex': el => Speech.say(G.cur.w.examples[+el.dataset.k], null),
  'card-ok': () => success(),
  'tile': el => tileTap(+el.dataset.k),
  'slot': el => slotTap(+el.dataset.i),
  'key': el => typeKey(el.dataset.c),
  'hint': () => { const c = G.cur; if (c.busy || c.done) return; c.ty ? typeHint(false) : revealSlot(false); },
  'next': () => nextRound(),
  // garden
  'plot': el => {
    const bi = +el.dataset.b, pi = +el.dataset.p, p = S.farm.beds[bi].plots[pi], st = plotState(p);
    if (st === 'empty') return seedPicker(bi, pi);
    if (st === 'water') { if (waterPlot(bi, pi)) { Sfx.water(); save(); render(); setTimeout(() => cur.name === 'garden' && render(), 1300); } return; }
    if (st === 'ripe') return harvest(bi, pi, el);
    plotInfo(bi, pi);
  },
  'water-bed': el => {
    const bi = +el.dataset.b; let n = 0;
    S.farm.beds[bi].plots.forEach((p, pi) => { if (waterPlot(bi, pi, true)) n++; });
    if (!n) return toast('💧 Out of water! Learn more words or sell your harvest at the Market.');
    Sfx.water(); save(); render(); setTimeout(() => cur.name === 'garden' && render(), 1300);
    const left = S.farm.beds[bi].plots.filter(p => plotState(p) === 'water').length;
    toast(`💧 Watered ${plural(n, 'plant')}${left ? ` · ${left} not watered (out of water)` : ''}`);
  },
  'plant': el => {
    const t = el.dataset.t, bi = +el.dataset.b, pi = +el.dataset.p;
    if (!(S.farm.seeds[t] > 0) || S.farm.beds[bi].plots[pi]) return;
    S.farm.seeds[t]--; S.farm.beds[bi].plots[pi] = {t, stage:0, wAt:null};
    save(); closeModal(); Sfx.pop(); toast(`🌰 Planted ${PLANTS[t].name}! Tap 💧 to water it.`); render();
  },
  'uproot': async el => {
    const bi = +el.dataset.b, pi = +el.dataset.p, p = S.farm.beds[bi].plots[pi];
    if (!await askModal(`Remove the ${esc(PLANTS[p.t].name.toLowerCase())}? The spot will be free for a new plant.`, 'Remove', true)) return;
    S.farm.beds[bi].plots[pi] = null; save(); render();
  },
  'barn': () => barnModal(),
  'buy-land': async () => {
    const cost = BED_COST[S.farm.beds.length];
    if (S.farm.beds.length >= MAX_BEDS) return;
    if (S.farm.coins < cost) { Sfx.bad(); return toast(`You need ${cost} 💰 to buy land. You have ${S.farm.coins} 💰 — learn a few more words! 📚`); }
    if (!await askModal(`Buy this land as bed ${S.farm.beds.length + 1} (holds ${PLOTS_PER_BED} plants) for ${cost} 💰?`, `Buy · ${cost} 💰`)) return;
    ACT['buy-bed']();
  },
  // shop
  'shop-sub': el => { shopState.sub = el.dataset.s; render(); },
  'shop-cat': el => {
    shopState.cat = el.dataset.c;
    document.querySelectorAll('.chips.jump .chip').forEach(c => c.classList.toggle('on', c === el));
    // scroll so the group's heading sits just below the sticky row of chips (which may wrap to two lines)
    const sec = $('#cat-' + el.dataset.c), bar = el.closest('.chips');
    if (sec) scrollTo({top:sec.getBoundingClientRect().top + scrollY - (bar ? bar.offsetHeight : 0) - 8, behavior:'smooth'});
  },
  'buy-seed': el => {
    const t = el.dataset.t, p = PLANTS[t];
    if (!plantUnlocked(t) || S.farm.coins < p.cost) return;
    S.farm.coins -= p.cost; S.farm.seeds[t] = (S.farm.seeds[t] || 0) + 1; save(); Sfx.coin();
    toast(`🛒 Bought 1 ${p.icon} ${p.name.toLowerCase()} seed. Go plant it!`); render();
  },
  'buy-bed': () => {
    const cost = BED_COST[S.farm.beds.length];
    if (S.farm.beds.length >= MAX_BEDS || S.farm.coins < cost) return;
    S.farm.coins -= cost; S.farm.beds.push(newBed()); save(); Sfx.win(); FX.burst(60);
    toast(`🚜 Your garden got bed ${S.farm.beds.length}!`); checkBadges(); render();
  },
  'sell': el => sell(el.dataset.t, +el.dataset.n),
  'sell-all': () => { let w = 0; for (const [t, n] of Object.entries(S.farm.barn)) if (n > 0 && itemInfo(t)) w += sell(t, n, true); if (w) toast(`🏪 Sold all your harvest for ${w} ${shopState.trade === 'feed' ? '🌾' : '💧'}`); render(); },
  'trade': el => { shopState.trade = el.dataset.c; render(); },
  // animals
  'garden-view': el => { gardenView = el.dataset.v; render(); },
  'buy-pen': () => {
    const cost = PEN_COST[S.farm.pens.length];
    if (S.farm.pens.length >= MAX_PENS) return;
    if (S.farm.coins < cost) { Sfx.bad(); return toast(`You need ${cost} 💰 to build a pen. You have ${S.farm.coins} 💰 — learn a few more words! 📚`); }
    penPicker();
  },
  'build-pen': el => {
    const t = el.dataset.t, A = ANIMALS[t], cost = PEN_COST[S.farm.pens.length];
    if (!animalUnlocked(t) || S.farm.coins < cost || S.farm.pens.length >= MAX_PENS) return;
    S.farm.coins -= cost; S.farm.pens.push({t, animals:Array.from({length:A.cap}, () => null)});
    save(); closeModal(); Sfx.win(); FX.burst(60); checkBadges();
    toast(`🏗️ Built a ${esc(A.pen.toLowerCase())}! Tap ＋ to buy a ${A.name.toLowerCase()}.`, 3500);
    gardenView = 'animals'; go('garden');
  },
  'buy-animal': el => {
    const t = el.dataset.t, slot = freeSlot(t);
    if (slot) ACT.animal({dataset:{n:slot[0], a:slot[1]}});
  },
  'animal': el => {
    const ni = +el.dataset.n, ai = +el.dataset.a, pen = S.farm.pens[ni], a = pen.animals[ai], A = ANIMALS[pen.t], st = animalState(a);
    if (st === 'empty') {
      if (S.farm.coins < A.cost) { Sfx.bad(); return toast(`A ${A.name.toLowerCase()} costs ${A.cost} 💰. You have ${S.farm.coins} 💰.`); }
      S.farm.coins -= A.cost; pen.animals[ai] = {adult:false, g:0, fAt:null, ready:false};
      save(); Sfx.coin(); checkBadges(); toast(`${A.icon} Welcome, little ${A.baby.toLowerCase()}! Feed it 🌾 to help it grow.`); return render();
    }
    if (st === 'hungry') { if (feedAnimal(ni, ai)) { Sfx.pop(); save(); render(); } return; }
    if (st === 'ready') {
      S.farm.barn['a:' + pen.t] = (S.farm.barn['a:' + pen.t] || 0) + A.yield; S.farm.collected = (S.farm.collected || 0) + 1;
      a.ready = false; save(); Sfx.win();
      const r = el.getBoundingClientRect(); FX.burst(12, [A.pIcon], r.left + r.width / 2, r.top + r.height / 3, 5);
      toast(`${A.pIcon} Collected ${A.yield} ${A.product.toLowerCase()}! Feed it again for more.`); checkBadges(); return render();
    }
    animalInfo(ni, ai);
  },
  'feed-pen': el => {
    const ni = +el.dataset.n; let n = 0;
    S.farm.pens[ni].animals.forEach((a, ai) => { if (feedAnimal(ni, ai, true)) n++; });
    if (!n) return toast('🌾 Not enough feed! Learn more words or trade harvest for feed at the Market.');
    Sfx.pop(); save(); render();
    const left = S.farm.pens[ni].animals.filter(a => animalState(a) === 'hungry').length;
    toast(`🌾 Fed ${plural(n, 'animal')}${left ? ` · ${left} still hungry (out of feed)` : ''}`);
  },
  // data
  'export': () => {
    const profiles = {}; for (const p of R.profiles) profiles[p.id] = stateOf(p.id);
    const blob = new Blob([JSON.stringify({app:'nttv', v:3, root:R, profiles, imgs:IMG})], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `word-farm-backup-${today()}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  },
  'reset-all': async () => {
    if (!await askModal(`Delete ALL children, words, progress and gardens${Cloud.user ? ' on this device and in the cloud' : ''}? This can't be undone.`, 'Delete everything', true)) return;
    if (Cloud.user) {
      // remove the children from the cloud too, then sign out
      const photos = R.profiles.flatMap(p => Object.values(stateOf(p.id).words).filter(w => w.img === 'idb').map(w => w.id));
      R.deletedIds = [...new Set([...(R.deletedIds || []), ...R.profiles.map(p => p.id)])];
      R.photoDel = [...new Set([...(R.photoDel || []), ...photos])]; R.dirty = {}; R.photoUp = [];
      for (const p of R.profiles) localStorage.removeItem(PKEY(p.id));
      R.profiles = []; R.active = null; S = null; saveRoot();
      await Cloud.sync(true);
      if (Cloud.status === 'error') return toast('⚠️ Could not delete the cloud copy: ' + esc(Cloud.err), 5000);
      await Cloud.sb.auth.signOut().catch(() => {});
    }
    for (const p of R.profiles) localStorage.removeItem(PKEY(p.id));
    localStorage.removeItem(ROOT_KEY); localStorage.removeItem(OLD_KEY);
    try { for (const k of Object.keys(IMG)) await IDB.del(k); } catch (e) {}
    location.reload();
  }
};
function harvest(bi, pi, el) {
  const p = S.farm.beds[bi].plots[pi], sp = PLANTS[p.t];
  S.farm.barn[p.t] = (S.farm.barn[p.t] || 0) + sp.yield;
  S.farm.harvests[p.t] = (S.farm.harvests[p.t] || 0) + 1; S.farm.totalHarvest++;
  const after = afterOf(p.t), timber = lifeOf(p.t) === 'timber';
  if (after == null) S.farm.beds[bi].plots[pi] = null; else { p.stage = after; p.wAt = null; }
  save(); Sfx.win();
  const r = el.getBoundingClientRect();
  FX.burst(14, [sp.icon], r.left + r.width / 2, r.top + r.height / 3, 5);
  toast(timber ? `🪓 Cut ${sp.yield} ${sp.icon} ${(sp.product || sp.name).toLowerCase()}! The tree grows back — keep watering.`
    : `🧺 Picked ${sp.yield} ${sp.icon} ${sp.name.toLowerCase()}! Stored in the barn.${after != null ? ' Keep watering for the next season.' : ''}`);
  checkBadges(); render();
}
function sell(t, n, quiet) {
  const have = S.farm.barn[t] || 0, it = itemInfo(t); n = Math.min(n, have); if (!n || !it) return 0;
  const w = n * it.sell, feed = shopState.trade === 'feed';
  S.farm.barn[t] = have - n; if (feed) S.farm.feed += w; else S.farm.water += w; save(); Sfx.water();
  if (!quiet) { toast(`🏪 Sold ${n} ${it.icon} for ${w} ${feed ? '🌾' : '💧'}`); render(); }
  return w;
}
document.body.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const f = ACT[el.dataset.act]; if (f) f(el, e);
});
document.body.addEventListener('input', e => {
  const el = e.target, f = el.dataset.field; if (!f) return;
  if (f === 'draft-word') draft[+el.dataset.i].word = el.value;
  else if (f === 'draft-def') draft[+el.dataset.i].def = el.value;
  else if (f === 'draft-ex') draft[+el.dataset.i].ex = el.value;
  else if (f === 'rb-val') { RB.rules[+el.dataset.i].val = el.value; runRules(); const c = $('#rb-results'); if (c) c.innerHTML = rbResultsHTML(); }
  else if (f === 'rb-name') RB.name = el.value;
  else if (f === 'draft-list') draft[+el.dataset.i].list = el.value;
  else if (f === 'edit-word') editRows.rows[+el.dataset.i].word = el.value;
  else if (f === 'edit-def') editRows.rows[+el.dataset.i].def = el.value;
  else if (f === 'new-name') addState.newName = el.value;
  else if (f === 'list-name') { const l = S.lists.find(x => x.id === el.dataset.id); if (l) { l.name = el.value.trim() || l.name; save(); } }
  else if (f === 'def') { const w = S.words[el.dataset.id]; w.def = el.value.trim(); w.defUser = true; save(); }
  else if (f === 'examples') { const w = S.words[el.dataset.id]; w.examples = el.value.split('\n').map(s => s.trim()).filter(Boolean); w.exUser = true; save(); }
});
document.body.addEventListener('change', async e => {
  const el = e.target, f = el.dataset.change; if (!f) return;
  if (f === 'add-list') { addState.list = el.value; render(); }
  else if (f === 'report-list') go('report', {id:el.dataset.id, list:el.value || null});
  else if (f === 'rb-add' && el.value) { RB.rules.push({type:el.value, val:RULE_DEFAULT[el.value]}); runRules(); render(); }
  else if (f === 'rb-val') { RB.rules[+el.dataset.i].val = el.value; runRules(); render(); }
  else if (f === 'rb-sort') { RB.sort = el.value; runRules(); render(); }
  else if (f === 'rb-limit') { RB.limit = el.value === 'all' ? 'all' : +el.value; runRules(); render(); }
  else if (f === 'rb-tick') { if (el.checked) RB.checked.add(el.dataset.id); else RB.checked.delete(el.dataset.id); $('#rb-results').innerHTML = rbResultsHTML(); }
  else if (f === 'vocab-file' && el.files[0]) { await readVocabFile(el.files[0]); el.value = ''; }
  else if (f === 'rate') { S.settings.rate = +el.value; save(); $('#ratev').textContent = el.value; }
  else if (f === 'sound') { S.settings.sound = el.checked; save(); }
  else if (f === 'ocr-file' && el.files[0]) {
    const file = el.files[0];
    if (addState.ocr && addState.ocr.url) URL.revokeObjectURL(addState.ocr.url);
    addState.ocr = {file, url:URL.createObjectURL(file)}; refreshOcr(); runOCR();
  }
  else if (f === 'img-upload' && el.files[0]) {
    const w = S.words[el.dataset.id];
    try { const data = await resizeImage(el.files[0]); IMG[w.id] = data; await IDB.put(w.id, data); w.img = 'idb'; w.picDone = true; save(); if (R.cloudOwner) Cloud.photoAdded(w.id); toast('📷 Using your photo!'); }
    catch (err) { toast('Could not open this image.'); }
    if (pickQueue) { nextPick(); return; }
    if (['list', 'edit-list'].includes(cur.name)) render();
    if (cur.name === 'edit-list') closeModal(); else wordModal(w.id);
  }
  else if (f === 'import' && el.files[0]) {
    try {
      const d = JSON.parse(await el.files[0].text());
      if (d.app !== 'nttv' || !(d.root || (d.state && d.state.words))) throw new Error();
      if (!await askModal('Replace all current data with the data in this backup file?', 'Restore', true)) return;
      for (const p of R.profiles) localStorage.removeItem(PKEY(p.id));
      const now = Date.now();
      let root, states;
      if (d.root) { root = d.root; states = d.profiles || {}; }
      else { // backup from before profiles existed: becomes one child
        const id = uid(); root = {profiles:[{id, name:'My child', avatar:'🐰', created:now}], active:id}; states = {[id]:d.state};
      }
      // keep the cloud account of this device; the restored children count as the newest copy
      root.cloudOwner = R.cloudOwner; root.dirty = {}; root.photoUp = [];
      root.deletedIds = R.cloudOwner ? R.profiles.map(p => p.id).filter(id => !root.profiles.some(q => q.id === id)) : [];
      for (const p of root.profiles) { p.updatedAt = now; root.dirty[p.id] = now; }
      localStorage.setItem(ROOT_KEY, JSON.stringify(root));
      for (const [id, st] of Object.entries(states)) localStorage.setItem(PKEY(id), JSON.stringify(st));
      for (const [k, v] of Object.entries(d.imgs || {})) { await IDB.put(k, v); if (R.cloudOwner) root.photoUp.push(k); }
      localStorage.setItem(ROOT_KEY, JSON.stringify(root));
      location.reload();
    } catch (err) { toast('This backup file isn\'t valid.'); }
  }
});
document.addEventListener('keydown', e => {
  if (e.target.matches && e.target.matches('input,textarea,select')) {
    if (e.key === 'Enter' && e.target.id === 'gate') ACT['gate-ok']();
    if (e.key === 'Enter' && e.target.id === 'kid-name') $('[data-act=save-kid]').click();
    if (e.key === 'Enter' && e.target.id === 'cloud-email') $('#cloud-pw').focus();
    if (e.key === 'Enter' && e.target.id === 'cloud-pw') $('[data-act=cloud-login]').click();
    if (e.key === 'Enter' && e.target.id === 'new-pw') $('#new-pw2').focus();
    if (e.key === 'Enter' && e.target.id === 'new-pw2') $('[data-act=cloud-pw-save]').click();
    if (e.key === 'Enter' && e.target.id === 'cloud-code') $('[data-act=cloud-code]').click();
    return;
  }
  if (e.key === 'Escape' && $('#modal').classList.contains('on')) return ACT['close-modal']();
  if (cur.name !== 'game' || !G || !G.cur) return;
  const c = G.cur, k = e.key.toLowerCase();
  if (e.key === 'Enter') { if (c.done) nextRound(); else if (c.r.k === 'card') success(); return; }
  if (c.done) return;
  if (c.slots) {
    if (/^[a-z]$/.test(k)) { const t = c.slots.tray.find(t => !t.used && !t.bad && t.ch === k); if (t) tileTap(t.k); }
    else if (e.key === 'Backspace') { const s = c.slots; const i = [...s.blanks].reverse().find(i => s.fill[i] != null && !s.locked[i]); if (i != null) slotTap(i); }
  } else if (c.ty) {
    if (/^[a-z]$/.test(k)) typeKey(k);
    else if (e.key === 'Backspace') typeKey('back');
  }
});

// ---------- clock: plants grow, learning time ----------
let tick = 0;
setInterval(() => {
  if (!S) return;
  const changed = tickPlants();
  if (cur.name === 'garden') { if (changed) render(); else updateTimers(); }
  else if (changed) renderTabbar();
  if (document.visibilityState !== 'visible' || cur.name !== 'game') return;
  dayLog().s++;
  if (++tick % 10 === 0) save();
}, 1000);
addEventListener('online', () => S && queueEnrich(Object.values(S.words).filter(w => !w.enriched).map(w => w.id)));

// ---------- start ----------
(async function init() {
  loadRoot(); FX.init(); Speech.init();
  try { Object.assign(IMG, await IDB.all()); } catch (e) {}
  if (Cloud.enabled()) {
    // signed in on this device: get the newest copy from the cloud before the child starts playing
    app.innerHTML = `<div class="card mascot-card" style="margin-top:30vh"><div class="mascot">🐰</div><div class="bubble">Loading Word Farm…</div></div>`;
    await Promise.race([Cloud.init().then(() => Cloud.busy ? new Promise(r => { const t = setInterval(() => { if (!Cloud.busy) { clearInterval(t); r(); } }, 100); }) : null), sleep(7000)]);
  }
  if (!S && R.active && profile(R.active)) S = loadState(R.active);
  if (S) rollDay(); else if (R.active && !profile(R.active)) { R.active = null; saveRoot(); }
  go(S ? 'learn' : 'profiles');
  if (!R.profiles.length && !(Cloud.enabled() && !Cloud.user)) kidForm(null);
  if (S) queueEnrich(Object.values(S.words).filter(w => !w.enriched).map(w => w.id));
})();
// coming back to the app: fetch changes made on other devices
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Cloud.user && Date.now() - Cloud.lastPull > 30000) Cloud.sync(); });
addEventListener('online', () => Cloud.user && Cloud.sync());
</script>
